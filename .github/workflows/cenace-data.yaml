name: CENACE Data

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      execution_date:
        description: "Execution date YYYY-MM-DD. Target downloaded date is execution_date + 1 day."
        required: false
        type: string

jobs:
  update-cenace-data:
    runs-on: ubuntu-latest

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: ${{ secrets.MODAL_ENVIRONMENT }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set execution date
        id: dates
        run: |
          if [ -n "${{ inputs.execution_date }}" ]; then
            echo "execution_date=${{ inputs.execution_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "execution_date=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Update CENACE data
        run: make update-cenace-data EXECUTION_DATE=${{ steps.dates.outputs.execution_date }}
